[Unit]
# XDG autostart 应用(app-*.service)等 DMS(quickshell,提供 StatusNotifierWatcher
# 托盘服务)先就绪。Electron 应用启动时若托盘服务尚未注册,
# 会放弃创建托盘图标且不再重试,导致托盘图标永久缺失。
After=dms.service

[Service]
# 仅当 dms.service 活跃时才等待托盘 DBus 服务注册(最多 10 秒),
# 其他环境(无 DMS)零延迟直接通过
ExecStartPre=-/bin/sh -c 'systemctl --user -q is-active dms.service || exit 0; exec timeout 10 sh -c "until busctl --user status org.kde.StatusNotifierWatcher >/dev/null 2>&1; do sleep 0.2; done"'
